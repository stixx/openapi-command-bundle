version: 2

updates:
  # Actions are referenced by floating major tags, so a moved tag runs new code in CI with repository
  # credentials. Keeping them current is the point of this entry.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - '*'
    commit-message:
      prefix: ci

  # Security updates only. This package ships no lock file, so there is nothing to bump routinely and a
  # security update means raising a constraint in composer.json — which is the action that actually
  # protects consumers. open-pull-requests-limit: 0 disables version updates; security updates are
  # governed by the repository setting and still apply.
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: chore
