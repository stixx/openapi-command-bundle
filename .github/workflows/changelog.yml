name: Changelog
on:
  push:
    branches:
      - main
  pull_request: ~
  workflow_dispatch: ~

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  changelog:
    name: Changelog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code with tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      # Before publishing a release, run `php .github/scripts/check-changelog.php X.Y.Z` on the pulled main: it also
      # checks that the entry is dated today (UTC), the day the GitHub release creates the tag.
      - name: Check CHANGELOG.md against the tags
        run: php .github/scripts/check-changelog.php
