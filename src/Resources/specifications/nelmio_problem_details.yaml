nelmio_api_doc:
  documentation:
    components:
      responses:
        InvalidRequestProblemDetailsResponse:
          description: RFC 9457 Problem Details for a request that does not match the API specification
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetailsInvalidRequestBody'
              example:
                type: 'about:blank'
                title: 'Bad Request'
                status: 400
                detail: 'The request does not match the API specification.'
                violations:
                  - propertyPath: 'title'
                    message: 'Keyword validation failed: Value cannot be null'
                    code: 'nullable'
                    constraint: 'openapi_request_validation'
                    error: null
        UnprocessableEntityProblemDetailsResponse:
          description: RFC 9457 Problem Details for a command that fails validation
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetailsInvalidRequestBody'
              example:
                type: 'about:blank'
                title: 'Unprocessable Content'
                status: 422
                detail: 'Validation failed'
                violations:
                  - propertyPath: 'title'
                    message: 'This value should not be blank.'
                    code: 'c1051bb4-d103-4f74-8988-acbcafc7fdc3'
                    constraint: 'NotBlank'
                    error: 'IS_BLANK_ERROR'
        UnauthorizedProblemDetailsResponse:
          description: RFC 9457 Unauthorized Problem Details
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: 'about:blank'
                title: 'Unauthorized'
                status: 401
                detail: 'The authentication token is missing or invalid.'
        ForbiddenProblemDetailsResponse:
          description: RFC 9457 Forbidden Problem Details
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: 'about:blank'
                title: 'Forbidden'
                status: 403
                detail: 'You are not allowed to perform this action.'
        ResourceNotFoundProblemDetailsResponse:
          description: RFC 9457 Resource Not Found Problem Details
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: 'about:blank'
                title: 'Not Found'
                status: 404
                detail: 'The requested resource could not be found.'
        ConflictProblemDetailsResponse:
          description: RFC 9457 Conflict Problem Details
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: 'about:blank'
                title: 'Conflict'
                status: 409
                detail: 'The resource already exists.'
        DefaultProblemDetailsResponse:
          description: RFC 9457 Default Problem Details
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: 'about:blank'
                title: 'Internal Server Error'
                status: 500
